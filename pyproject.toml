[project]
name = "sruti"
version = "0.2.0"
description = "A private listening agent: CW from a public KiwiSDR, decoded and explained on the Mac."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sruti = "sruti.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sruti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["var"]

[tool.ruff.lint]
# An explicit set, so the gate does not move with ruff's defaults.
select = ["E", "F", "W", "B", "SIM", "RUF", "S", "BLE", "DTZ", "PIE", "EXE", "ISC", "UP", "I"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes, ×, − and other typography are deliberate

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The PoCs are frozen experiments: correctness checks only, not the product's style rules.
"poc/**" = ["B905", "E402", "E501", "ISC", "RUF", "S", "SIM", "UP"]
